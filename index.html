<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lyrics Card Generator Web Lite</title>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #111827;
      color: #f9fafb;
    }

    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      gap: 24px;
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 18px;
      backdrop-filter: blur(16px);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
    }

    .hint {
      margin: 0 0 20px;
      color: #cbd5e1;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      color: #d1d5db;
      font-size: 14px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 12px;
      padding: 11px 12px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      outline: none;
      font: inherit;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
      line-height: 1.6;
    }

    button {
      width: 100%;
      margin-top: 16px;
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      background: #3b82f6;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #2563eb;
    }

    .card-wrap {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: auto;
    }

    #card {
      width: 360px;
      min-height: 560px;
      padding: 28px;
      border-radius: 28px;
      background:
        linear-gradient(145deg, rgba(15, 23, 42, 0.72), rgba(2, 6, 23, 0.92)),
        var(--cover-bg, linear-gradient(135deg, #334155, #020617));
      background-size: cover;
      color: white;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .cover {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: 22px;
      object-fit: cover;
      background: rgba(255, 255, 255, 0.12);
      display: none;
    }

    .song-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.15;
      font-weight: 800;
    }

    .artist {
      margin-top: 6px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 14px;
    }

    .lyrics {
      white-space: pre-wrap;
      font-size: 24px;
      line-height: 1.42;
      font-weight: 750;
      letter-spacing: -0.02em;
    }

    .translation {
      white-space: pre-wrap;
      color: rgba(255, 255, 255, 0.72);
      font-size: 16px;
      line-height: 1.55;
    }

    .watermark {
      margin-top: auto;
      color: rgba(255, 255, 255, 0.52);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="panel">
      <h1>Lyrics Card Generator Web Lite</h1>
      <p class="hint">静态网页版：手动输入内容，上传封面，导出 PNG。</p>

      <label>歌曲标题</label>
      <input id="title" value="Opposite" />

      <label>歌手</label>
      <input id="artist" value="Sabrina Carpenter" />

      <label>封面图片</label>
      <input id="coverInput" type="file" accept="image/*" />

      <label>歌词</label>
      <textarea id="lyrics">And I know now
Even if I tried to change
That somehow
You'd end up with her anyway</textarea>

      <label>译文</label>
      <textarea id="translation">我如今才明白
纵使我拼尽全力改写结局
命运兜兜转转
你终究还是会走向她</textarea>

      <label>字号</label>
      <select id="fontSize">
        <option value="20">小</option>
        <option value="24" selected>中</option>
        <option value="30">大</option>
      </select>

      <button id="exportBtn">导出 PNG</button>
    </section>

    <section class="panel card-wrap">
      <article id="card">
        <img id="cover" class="cover" alt="cover" />
        <div>
          <h2 id="cardTitle" class="song-title"></h2>
          <div id="cardArtist" class="artist"></div>
        </div>
        <div id="cardLyrics" class="lyrics"></div>
        <div id="cardTranslation" class="translation"></div>
        <div class="watermark">Made with Lyrics Card Generator Web Lite</div>
      </article>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);

    const inputs = ["title", "artist", "lyrics", "translation", "fontSize"];

    function render() {
      $("cardTitle").textContent = $("title").value || "Untitled";
      $("cardArtist").textContent = $("artist").value || "Unknown Artist";
      $("cardLyrics").textContent = $("lyrics").value;
      $("cardTranslation").textContent = $("translation").value;
      $("cardLyrics").style.fontSize = $("fontSize").value + "px";
    }

    for (const id of inputs) {
      $(id).addEventListener("input", render);
    }

    $("coverInput").addEventListener("change", () => {
      const file = $("coverInput").files[0];
      if (!file) return;

      const url = URL.createObjectURL(file);
      const cover = $("cover");
      cover.src = url;
      cover.style.display = "block";

      $("card").style.setProperty(
        "--cover-bg",
        `linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.72)), url("${url}")`
      );
    });

    $("exportBtn").addEventListener("click", async () => {
      const node = $("card");
      const title = ($("title").value || "lyric-card")
        .replace(/[\\/:*?"<>|]/g, "")
        .trim();

      const dataUrl = await htmlToImage.toPng(node, {
        pixelRatio: 3,
        cacheBust: true
      });

      const link = document.createElement("a");
      link.download = `${title || "lyric-card"}.png`;
      link.href = dataUrl;
      link.click();
    });

    render();
  </script>
</body>
</html>
