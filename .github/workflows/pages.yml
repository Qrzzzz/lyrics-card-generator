name: Deploy Web Lite to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - web-lite/**
      - components/**
      - lib/**
      - app/globals.css
      - scripts/build-web-lite.mjs
      - scripts/check-web-lite.mjs
      - tailwind.config.ts
      - package.json
      - package-lock.json
      - tsconfig.json
      - public/app-icon.png
      - public/fonts/SourceHanSansSC-Heavy.otf
      - public/fonts/SourceHanSerifSC-Heavy.otf
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment after publication has started; a later push queues
# behind the in-flight deployment instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and rebuild Web Lite
        # Verification catches stale committed output before rebuilding the
        # exact artifact that will be copied into the Pages bundle.
        run: |
          npm run web-lite:check
          npm run web-lite:build

      - name: Prepare static site
        # Keep the deployment allowlist explicit so no desktop or repository
        # files can leak into the public Pages artifact.
        run: |
          rm -rf _site
          mkdir -p _site/public/fonts
          cp index.html _site/index.html
          cp public/app-icon.png _site/public/app-icon.png
          cp public/fonts/SourceHanSansSC-Heavy.otf _site/public/fonts/SourceHanSansSC-Heavy.otf
          cp public/fonts/SourceHanSerifSC-Heavy.otf _site/public/fonts/SourceHanSerifSC-Heavy.otf
          touch _site/.nojekyll
          test -f _site/index.html
          test -f _site/public/app-icon.png
          test -f _site/public/fonts/SourceHanSansSC-Heavy.otf
          test -f _site/public/fonts/SourceHanSerifSC-Heavy.otf
          test -f _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
