name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      desktop_shared_groups:
        description: Measure shared unpacked transfer and independent Windows groups before promotion
        type: boolean
        default: false
      desktop_visual_diagnostics:
        description: Run the non-blocking desktop pixel and frame-timing diagnostics
        required: false
        default: false
        type: boolean
      desktop_rehearsal_fail_group:
        description: Manual shared-canary rehearsal only; fail one group on attempt 1 before scenarios
        type: choice
        default: none
        options: [none, editor, data, native]
      desktop_runtime_retention_days:
        description: Manual shared-canary runtime retention; use one day only for a real expiry acceptance run
        type: choice
        default: '7'
        options: ['7', '1']

# Supersede stale runs for the same branch or pull request while keeping
# unrelated validation independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce production dependency advisory policy
        run: npm run dependency-audit:gate

      - name: Test release SBOM policy
        run: npm run sbom:test

      - name: Verify Web Lite artifact
        id: web-lite-artifact
        run: npm run web-lite:check

      # Dependabot updates lockfiles, but cannot commit our generated Web Lite.
      # Preserve the strict failure and provide the matching rebuild for review.
      - name: Prepare Dependabot Web Lite artifact
        if: failure() && steps.web-lite-artifact.outcome == 'failure' && github.event.pull_request.user.login == 'dependabot[bot]'
        run: node scripts/build-web-lite.mjs --out=output/dependabot/index.html

      - name: Upload Dependabot Web Lite artifact
        if: failure() && steps.web-lite-artifact.outcome == 'failure' && github.event.pull_request.user.login == 'dependabot[bot]'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependabot-web-lite-${{ github.event.pull_request.head.sha }}
          path: output/dependabot/index.html
          if-no-files-found: error
          retention-days: 7

      - name: Verify font license distribution contracts
        run: npm run font-license:test

      - name: Enforce distribution resource budgets
        run: npm run distribution-budgets:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Stability, security, locale, and lifecycle tests
        run: npm run stability:test

      - name: Critical-module coverage thresholds
        run: npm run coverage

      - name: Preference writer fault-injection coverage
        run: npm run preferences-writer:coverage

      - name: Electron runtime risk-boundary coverage thresholds
        run: npm run electron-runtime:coverage

      - name: Core tests
        run: npm run core:test

      # The required render-boundary job owns the Linux production build.

  render-boundary-regression:
    name: render-boundary-regression
    # Keep production surface restoration, reduced-motion semantics, and
    # bounded React render work independent from fast source-contract checks.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Chromium runtime
        id: browser-runtime
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/render-boundaries
          node scripts/check-ci-browser-runtime.mjs --browsers=chromium 2>&1 | tee artifacts/render-boundaries/browser-runtime.log

      - name: Run production render-boundary regressions
        shell: bash
        run: |
          mkdir -p artifacts/render-boundaries
          npm run render-boundaries:test 2>&1 | tee artifacts/render-boundaries/command.log

      - name: Preserve render runtime context
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.browser-runtime.outcome }}
        run: |
          mkdir -p artifacts/render-boundaries
          printf '{"sourceSha":"%s","runId":"%s","attempt":"%s","runtime":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNTIME_OUTCOME" > artifacts/render-boundaries/runtime-context.json

      - name: Upload render-boundary diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-boundary-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/render-boundaries/**
            playwright-report/render-boundaries/**
            test-results/render-boundaries/**
          if-no-files-found: error
          retention-days: 14

  web-lite-smoke:
    name: web-lite-smoke
    # Browser tests remain isolated from the fast verification job so Chromium
    # setup and artifact evidence cannot delay type and contract feedback.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    # Browsers and OS dependencies come from the immutable image, not live apt.
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Chromium runtime
        id: browser-runtime
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/web-lite
          trap 'status=$?; echo "Chromium runtime: ${SECONDS}s; exit=${status}" >> "$GITHUB_STEP_SUMMARY"' EXIT
          node scripts/check-ci-browser-runtime.mjs --browsers=chromium 2>&1 | tee artifacts/web-lite/browser-runtime.log

      # verify owns freshness checking for this same checkout SHA. Browser
      # jobs consume the committed artifact without rebuilding it again.
      - name: Run Web Lite browser smoke tests
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p artifacts/web-lite
          trap 'status=$?; echo "Web Lite smoke: ${SECONDS}s; exit=${status}" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npm run web-lite:smoke 2>&1 | tee artifacts/web-lite/smoke.log

      - name: Run deferred editor surface recovery tests
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts/web-lite
          trap 'status=$?; echo "Deferred surfaces: ${SECONDS}s; exit=${status}" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npm run deferred-surfaces:test 2>&1 | tee artifacts/web-lite/deferred-surfaces.log

      - name: Preserve Web Lite runtime context
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.browser-runtime.outcome }}
        run: |
          mkdir -p artifacts/web-lite
          printf '{"sourceSha":"%s","runId":"%s","attempt":"%s","runtime":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNTIME_OUTCOME" > artifacts/web-lite/runtime-context.json

      - name: Upload Web Lite browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-lite-playwright-report-${{ github.run_attempt }}
          path: |
            artifacts/web-lite/**
            playwright-report/web-lite/**
            test-results/web-lite/**
            test-results/deferred-surfaces/**
          if-no-files-found: ignore

  web-lite-cross-browser-smoke:
    name: web-lite-cross-browser-smoke
    # Keep the release-blocking compatibility subset small: detailed geometry,
    # axe, format, render-boundary, and benchmark coverage stays Chromium-only.
    # Both short projects share one locked, preinstalled browser environment.
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001 --init --ipc=host
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Firefox and WebKit runtime
        id: browser-runtime
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/web-lite-cross-browser
          trap 'status=$?; echo "Compatibility runtime: ${SECONDS}s; exit=${status}" >> "$GITHUB_STEP_SUMMARY"' EXIT
          node scripts/check-ci-browser-runtime.mjs --browsers=firefox,webkit 2>&1 | tee artifacts/web-lite-cross-browser/browser-runtime.log

      # All five checks must pass together; verify owns artifact freshness.
      - name: Stage the committed production Web Lite artifact
        run: npm run pages:prepare

      - name: Run Firefox and WebKit Web Lite compatibility smoke
        timeout-minutes: 10
        shell: bash
        run: |
          mkdir -p artifacts/web-lite-cross-browser
          trap 'status=$?; echo "Compatibility tests: ${SECONDS}s; exit=${status}" >> "$GITHUB_STEP_SUMMARY"' EXIT
          npm run web-lite:cross-browser-smoke 2>&1 | tee artifacts/web-lite-cross-browser/command.log

      - name: Preserve compatibility runtime context
        if: always()
        shell: bash
        env:
          RUNTIME_OUTCOME: ${{ steps.browser-runtime.outcome }}
        run: |
          mkdir -p artifacts/web-lite-cross-browser
          printf '{"sourceSha":"%s","runId":"%s","attempt":"%s","runtime":"%s"}\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNTIME_OUTCOME" > artifacts/web-lite-cross-browser/runtime-context.json

      - name: Upload cross-browser Web Lite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-lite-cross-browser-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/web-lite-cross-browser/**
            playwright-report/web-lite-cross-browser/all/**
            test-results/web-lite-cross-browser/all/**
          if-no-files-found: error
          retention-days: 14

  desktop-legacy:
    name: desktop-legacy
    # A release consumes checks for the final main-push SHA. Keeping this job
    # PR-only would leave the packaged Windows result bound to a different PR
    # head or synthetic merge SHA after squash/rebase.
    if: (github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') && !inputs.desktop_shared_groups
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Exercise the real packaged app here. NSIS creation, installation, and
      # uninstallation belong to Release, which tests the bytes it publishes.
      - name: Build unpacked Windows desktop app
        id: desktop_build
        run: npm run desktop:pack

      - name: Verify staged and packaged desktop assets
        run: npm run desktop:packaged-assets-test -- --unpacked-only

      - name: Enforce packaged distribution budget
        run: node scripts/check-distribution-budgets.mjs --packaged

      - name: Run packaged desktop interaction regression
        run: npm run desktop:scenario-test && npm run desktop:interaction-test

      - name: Run opt-in desktop visual and frame-timing diagnostics
        if: ${{ always() && steps.desktop_build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.desktop_visual_diagnostics }}
        continue-on-error: true
        run: npm run desktop:visual-diagnostic

      - name: Upload desktop regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-regression-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/desktop/**
            output/playwright/desktop-updater/**
          if-no-files-found: ignore


  desktop-build:
    name: desktop-build
    # Explicit measurement canary; PR/main retain the proven path until cost is measured.
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_shared_groups
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      digest: ${{ steps.bundle.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build unpacked Windows desktop app
        run: npm run desktop:pack
      - name: Verify staged and packaged desktop assets
        run: npm run desktop:packaged-assets-test -- --unpacked-only
      - run: node scripts/check-distribution-budgets.mjs --packaged
      - name: Create identity-bound desktop bundle
        id: bundle
        run: node scripts/desktop-test-bundle.mjs pack
      - name: Upload desktop bundle (measure transfer)
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/desktop-bundle/
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ inputs.desktop_runtime_retention_days == '1' && 1 || 7 }}

  desktop-groups:
    name: desktop-group-${{ matrix.group }}
    needs: desktop-build
    if: github.event_name == 'workflow_dispatch' && inputs.desktop_shared_groups
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        group: [editor, data, native]
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      DESKTOP_BUILD_DIGEST: ${{ needs.desktop-build.outputs.digest }}
      DESKTOP_ARTIFACT_ID: ${{ needs.desktop-build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Check exact desktop artifact availability and identity
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-desktop-artifact.mjs
      - run: npm ci
      - name: Download exact desktop bundle (measure transfer)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.desktop-build.outputs.artifact-id }}
          path: artifacts/desktop-bundle
          # ID-based downloads otherwise add an artifact-name subdirectory.
          merge-multiple: true
      - name: Validate identity, digest and every runtime resource
        run: node scripts/desktop-test-bundle.mjs unpack
      - name: Fail selected group once for manual recovery rehearsal
        if: github.event_name == 'workflow_dispatch' && inputs.desktop_shared_groups && github.run_attempt == 1 && inputs.desktop_rehearsal_fail_group == matrix.group
        shell: pwsh
        run: throw 'Expected manual recovery rehearsal failure; inspect evidence, then explicitly rerun only this failed group.'
      - name: Run packaged desktop interaction regression
        run: npm run desktop:group:${{ matrix.group }}
      - name: Preserve transport or group failure context
        if: failure()
        shell: pwsh
        env:
          DESKTOP_GROUP: ${{ matrix.group }}
          DESKTOP_ARTIFACT_ID: ${{ needs.desktop-build.outputs.artifact-id }}
        run: |
          $directory = Join-Path 'artifacts/desktop-groups' $env:DESKTOP_GROUP
          New-Item -ItemType Directory -Path $directory -Force | Out-Null
          @{
            group = $env:DESKTOP_GROUP
            sourceSha = $env:GITHUB_SHA
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            artifactId = $env:DESKTOP_ARTIFACT_ID
            buildDigest = $env:DESKTOP_BUILD_DIGEST
            outcome = 'failure'
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $directory 'failure-context.json') -Encoding utf8
      - name: Upload group outcome and first-failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-group-result-${{ github.run_id }}-${{ matrix.group }}-${{ github.run_attempt }}
          path: |
            artifacts/desktop-groups/${{ matrix.group }}/**
            playwright-report/desktop/**
            output/playwright/**
          if-no-files-found: error
          retention-days: 14

  desktop-packaged-regression:
    name: desktop-packaged-regression
    # A failed/skipped/cancelled build or group must never authorize release.
    if: always()
    needs: [desktop-legacy, desktop-build, desktop-groups]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      DESKTOP_SHARED: ${{ github.event_name == 'workflow_dispatch' && inputs.desktop_shared_groups }}
      DESKTOP_LEGACY_RESULT: ${{ needs.desktop-legacy.result }}
      DESKTOP_BUILD_RESULT: ${{ needs.desktop-build.result }}
      DESKTOP_GROUPS_RESULT: ${{ needs.desktop-groups.result }}
      DESKTOP_BUILD_DIGEST: ${{ needs.desktop-build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Download group results from this run
        if: env.DESKTOP_SHARED == 'true' && needs.desktop-groups.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: desktop-group-result-${{ github.run_id }}-*
          path: artifacts/desktop-results
      - name: Enforce all desktop outcomes and artifact identities
        run: node scripts/check-desktop-regression-gate.mjs
      - name: Record queue, build, transfer and group step timings
        if: always()
        timeout-minutes: 3
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/record-desktop-ci-timings.mjs
      - name: Preserve desktop timing observations
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/desktop-timings.json
          if-no-files-found: warn
          retention-days: 90
