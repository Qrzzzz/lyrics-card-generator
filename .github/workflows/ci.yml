name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      desktop_visual_diagnostics:
        description: Run the non-blocking desktop pixel and frame-timing diagnostics
        required: false
        default: false
        type: boolean

# Supersede stale runs for the same branch or pull request while keeping
# unrelated validation independent.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce production dependency advisory policy
        run: npm run dependency-audit:gate

      - name: Verify Web Lite artifact
        run: npm run web-lite:check

      - name: Verify font license distribution contracts
        run: npm run font-license:test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Stability, security, locale, and lifecycle tests
        run: npm run stability:test

      - name: Critical-module coverage thresholds
        run: npm run coverage

      - name: Electron runtime risk-boundary coverage thresholds
        run: npm run electron-runtime:coverage

      - name: Core tests
        run: npm run core:test

      - name: Build
        run: npm run build

  render-boundary-regression:
    name: render-boundary-regression
    # Keep production renderer/export geometry coverage independent from the
    # fast type, lint, and source-contract feedback in the verify job.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production render-boundary regressions
        shell: bash
        run: |
          mkdir -p artifacts/render-boundaries
          npm run render-boundaries:test 2>&1 | tee artifacts/render-boundaries/command.log

      - name: Upload render-boundary diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: render-boundary-diagnostics-${{ github.run_attempt }}
          path: |
            artifacts/render-boundaries/**
            playwright-report/render-boundaries/**
            test-results/render-boundaries/**
          if-no-files-found: error
          retention-days: 14

  web-lite-smoke:
    name: web-lite-smoke
    # Browser tests remain isolated from the fast verification job so Chromium
    # setup and artifact evidence cannot delay type and contract feedback.
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify Web Lite artifact
        run: npm run web-lite:check

      - name: Run Web Lite browser smoke tests
        run: npm run web-lite:smoke

      - name: Run deferred editor surface recovery tests
        run: npm run deferred-surfaces:test

      - name: Upload Web Lite browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-lite-playwright-report-${{ github.run_attempt }}
          path: playwright-report/web-lite
          if-no-files-found: ignore

  web-lite-cross-browser-smoke:
    name: web-lite-cross-browser-smoke (${{ matrix.browser }})
    # Keep the release-blocking compatibility subset small: detailed geometry,
    # axe, format, render-boundary, and benchmark coverage stays Chromium-only.
    # Leave bounded headroom for runner-level system dependency installation.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser:
          - firefox
          - webkit

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Verify and stage the production Web Lite artifact
        run: |
          npm run web-lite:check
          npm run pages:prepare

      - name: Run ${{ matrix.browser }} Web Lite compatibility smoke
        env:
          WEB_LITE_BROWSER: ${{ matrix.browser }}
        run: npm run web-lite:cross-browser-smoke -- --project=${{ matrix.browser }}

      - name: Upload ${{ matrix.browser }} Web Lite diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-lite-${{ matrix.browser }}-diagnostics-${{ github.run_attempt }}
          path: |
            playwright-report/web-lite-cross-browser/${{ matrix.browser }}/**
            test-results/web-lite-cross-browser/${{ matrix.browser }}/**
          if-no-files-found: error
          retention-days: 14

  security-locale-a11y-gates:
    name: security/locale/a11y gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run security, locale, lifecycle, and coverage gates
        run: |
          npm run stability:test
          npm run coverage

      - name: Run automated axe gate
        run: npm run a11y:test

  desktop-packaged-regression:
    name: desktop-packaged-regression
    # A release consumes checks for the final main-push SHA. Keeping this job
    # PR-only would leave the packaged Windows result bound to a different PR
    # head or synthetic merge SHA after squash/rebase.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.desktop_visual_diagnostics)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows desktop artifacts
        id: desktop_build
        run: npm run desktop:build

      - name: Verify staged and packaged desktop assets
        run: npm run desktop:packaged-assets-test

      - name: Run packaged desktop interaction regression
        run: npm run desktop:interaction-test

      - name: Run Setup-only final-artifact smoke
        if: ${{ always() && steps.desktop_build.outcome == 'success' }}
        run: npm run desktop:final-artifact-smoke

      - name: Run opt-in desktop visual and frame-timing diagnostics
        if: ${{ always() && steps.desktop_build.outcome == 'success' && github.event_name == 'workflow_dispatch' && inputs.desktop_visual_diagnostics }}
        continue-on-error: true
        run: npm run desktop:visual-diagnostic

      - name: Verify Windows desktop artifacts
        if: ${{ always() && steps.desktop_build.outcome == 'success' }}
        shell: pwsh
        run: |
          $expectedName = "Lyrics.Card.Generator.Setup.$((Get-Content package.json -Raw | ConvertFrom-Json).version).exe"
          $executables = @(Get-ChildItem release -File -Filter '*.exe')
          if ($executables.Count -ne 1 -or $executables[0].Name -ne $expectedName) {
            throw "Expected the sole Windows artifact to be $expectedName; found $($executables.Name -join ', ')."
          }
          $executables | Select-Object Name, Length

      - name: Upload desktop regression evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-regression-evidence-${{ github.run_attempt }}
          path: |
            playwright-report/desktop/**
            playwright-report/desktop-final-artifacts/**
          if-no-files-found: ignore
