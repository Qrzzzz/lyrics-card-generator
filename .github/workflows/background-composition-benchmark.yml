name: Background Composition Benchmark

on:
  # Performance evidence is opt-in, not an unattended weekly prerequisite.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: background-composition-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --init --ipc=host
    timeout-minutes: 30
    env:
      CI: "true"
      RUN_BACKGROUND_COMPOSITION_BENCHMARK: "1"
      BACKGROUND_COMPOSITION_MAX_EXPORT_MS: "60000"
      BACKGROUND_COMPOSITION_MIN_LOGICAL_HEIGHT: "3000"
      BACKGROUND_COMPOSITION_TEST_TIMEOUT_MS: "180000"
      BACKGROUND_COMPOSITION_BENCHMARK_OUTPUT_DIR: artifacts/background-composition

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned Chromium runtime
        timeout-minutes: 2
        shell: bash
        run: |
          mkdir -p artifacts/background-composition
          node scripts/check-ci-browser-runtime.mjs --browsers=chromium 2>&1 | tee artifacts/background-composition/browser-runtime.log

      - name: Build the production Web Lite artifact
        shell: bash
        run: |
          mkdir -p artifacts/background-composition
          npm run web-lite:build 2>&1 | tee artifacts/background-composition/production-build.log

      - name: Run the large-canvas background composition benchmark
        shell: bash
        run: npm run background-composition:benchmark 2>&1 | tee artifacts/background-composition/command.log

      - name: Upload benchmark metrics and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: background-composition-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/background-composition/**
            playwright-report/web-lite/**
            test-results/web-lite/**
          if-no-files-found: error
          retention-days: 30
