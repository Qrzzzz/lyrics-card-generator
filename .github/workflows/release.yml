name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable or RC tag to publish
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  resolve:
    name: resolve-release-state
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release_state.outputs.version }}
      published: ${{ steps.release_state.outputs.published }}
      release_id: ${{ steps.release_state.outputs.release_id }}

    steps:
      - name: Checkout exact tag SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Validate tag and resolve existing release
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json has an invalid stable version: $version" }
          $escapedVersion = [regex]::Escape($version)
          if ($env:RELEASE_TAG -notmatch "^v$escapedVersion(?:-rc\.[0-9]+)?$") {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }

          $head = git rev-parse HEAD
          $tagHead = git rev-list -n 1 $env:RELEASE_TAG
          if ($head -ne $tagHead) { throw "Checkout SHA $head does not match tag SHA $tagHead" }

          @('en','es','fr','ja','zh-CN','zh-TW') | ForEach-Object {
            if (-not (Test-Path "docs/releases/v$version.$_.md")) {
              throw "Missing docs/releases/v$version.$_.md"
            }
          }

          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $matching = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          if ($matching.Count -gt 1) {
            throw "Found multiple GitHub releases for $env:RELEASE_TAG."
          }

          $published = $matching.Count -eq 1 -and -not $matching[0].draft
          $releaseId = if ($published) { [long]$matching[0].id } else { 0 }
          if ($published) {
            ./scripts/verify-github-release.ps1 `
              -ReleaseId $releaseId `
              -Repository $env:GITHUB_REPOSITORY `
              -Tag $env:RELEASE_TAG `
              -ExpectedState published `
              -OutputDirectory published-existing
            Write-Host "Release $env:RELEASE_TAG is already published and verified; publication is an idempotent no-op."
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "published=$($published.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_id=$releaseId" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  release:
    name: build-verify-publish
    needs: resolve
    if: needs.resolve.outputs.published != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PACKAGE_VERSION: ${{ needs.resolve.outputs.version }}

    steps:
      - name: Checkout exact tag SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run release quality gates
        shell: pwsh
        run: |
          npm run web-lite:check
          npm run typecheck
          npm run lint
          npm run stability:test
          npm run coverage
          npm run core:test
          npm run build

      - name: Build Setup and portable from tag SHA
        id: desktop_build
        run: npm run desktop:build

      - name: Run deterministic packaged interaction regression
        run: npm run desktop:interaction-test

      - name: Test final Setup and portable bytes
        if: ${{ always() && steps.desktop_build.outcome == 'success' }}
        run: npm run desktop:final-artifact-smoke

      - name: Normalize release asset filenames
        shell: pwsh
        run: |
          $executables = @(Get-ChildItem release -File -Filter '*.exe')
          if ($executables.Count -ne 2) { throw "Expected exactly two release executables, found $($executables.Count)." }
          $executables | ForEach-Object {
            $file = $_
            $normalizedName = $file.Name -replace ' ', '.'
            if ($normalizedName -eq $file.Name) { return }
            $normalizedPath = Join-Path $file.DirectoryName $normalizedName
            if (Test-Path -LiteralPath $normalizedPath) { throw "Normalized asset already exists: $normalizedName" }
            Rename-Item -LiteralPath $file.FullName -NewName $normalizedName
          }
          $remainingSpaces = @(Get-ChildItem release -File -Filter '*.exe' | Where-Object { $_.Name.Contains(' ') })
          if ($remainingSpaces.Count -gt 0) { throw "Release asset normalization left names with spaces: $($remainingSpaces.Name -join ', ')" }

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          format: spdx-json
          output-file: release/lyrics-card-generator-${{ needs.resolve.outputs.version }}.spdx.json
          upload-artifact: false

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -like '*.spdx.json' } | Sort-Object Name
          if ($files.Count -lt 3) { throw 'Expected Setup, portable, and SBOM files.' }
          $lines = $files | ForEach-Object { '{0} *{1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release/SHA256SUMS'), $lines, [Text.UTF8Encoding]::new($false))

      - name: Attest tested release files
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/*.exe
            release/SHA256SUMS
            release/*.spdx.json

      - name: Upload tested release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lyrics-card-generator-${{ env.RELEASE_TAG }}-tested
          path: |
            release/*.exe
            release/SHA256SUMS
            release/*.spdx.json
            playwright-report/desktop/**
            playwright-report/desktop-final-artifacts/**
          if-no-files-found: error

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $matching = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG })
          $published = @($matching | Where-Object { -not $_.draft })
          if ($published.Count -gt 0) {
            throw "Release $env:RELEASE_TAG became published after state resolution; rerun to verify it idempotently."
          }
          @($matching | Where-Object { $_.draft }) | ForEach-Object {
            gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($_.id)"
          }

          $flags = @()
          if ($env:RELEASE_TAG -like '*-rc.*') { $flags += '--prerelease' }
          gh release create $env:RELEASE_TAG release/*.exe release/SHA256SUMS release/*.spdx.json --draft --verify-tag --title "Lyrics Card Generator $env:RELEASE_TAG" --notes-file "docs/releases/v$env:PACKAGE_VERSION.zh-CN.md" @flags

          $releases = @(gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json)
          $drafts = @($releases | Where-Object { $_.tag_name -eq $env:RELEASE_TAG -and $_.draft })
          if ($drafts.Count -ne 1) { throw "Expected exactly one draft release for $env:RELEASE_TAG, found $($drafts.Count)." }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_ID=$($drafts[0].id)" -Encoding utf8

      - name: Re-download and verify exact draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-github-release.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -ExpectedState draft `
            -OutputDirectory published-draft

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $published = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false | ConvertFrom-Json
          if ($published.draft) { throw "Release $env:RELEASE_ID remained a draft after publishing." }
          if ($published.tag_name -ne $env:RELEASE_TAG) { throw "Published release tag $($published.tag_name) does not match $env:RELEASE_TAG." }
