name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable or RC tag to publish
        required: true
        type: string

# Serialize by tag so retries cannot create competing drafts for one release.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

# Every job opts into only the permissions needed for its phase. In
# particular, source authorization cannot mutate repository or Release state.
permissions: {}

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  authorize:
    name: authorize-release-source
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: read
      pull-requests: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      release_sha: ${{ steps.metadata.outputs.release_sha }}
      main_sha: ${{ steps.source.outputs.main_sha }}
      reviewed_pr: ${{ steps.source.outputs.reviewed_pr }}
      ci_run_id: ${{ steps.source.outputs.ci_run_id }}
      ci_run_attempt: ${{ steps.source.outputs.ci_run_attempt }}
      published: ${{ steps.release_state.outputs.published }}
      release_id: ${{ steps.release_state.outputs.release_id }}

    steps:
      - name: Checkout exact tag ref
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag metadata and bind local commit
        id: metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          $version = node -p "require('./package.json').version"
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json has an invalid stable version: $version" }
          $escapedVersion = [regex]::Escape($version)
          if ($env:RELEASE_TAG -notmatch "^v$escapedVersion(?:-rc\.[0-9]+)?$") {
            throw "Tag $env:RELEASE_TAG does not match package version $version."
          }

          $tagRef = "refs/tags/$env:RELEASE_TAG"
          git show-ref --verify $tagRef | Out-Null
          $head = git rev-parse HEAD
          $tagHead = git rev-parse "$tagRef^{commit}"
          if ($head -ne $tagHead) { throw "Checkout SHA $head does not match peeled tag SHA $tagHead" }

          @('en','es','fr','ja','zh-CN','zh-TW') | ForEach-Object {
            if (-not (Test-Path "docs/releases/v$version.$_.md")) {
              throw "Missing docs/releases/v$version.$_.md"
            }
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release_sha=$tagHead" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Authorize reviewed main ancestry and exact CI
        id: source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
        run: |
          node ./scripts/verify-release-source.mjs `
            --repository $env:GITHUB_REPOSITORY `
            --tag $env:RELEASE_TAG `
            --expected-sha $env:EXPECTED_RELEASE_SHA `
            --output release-source-evidence.json `
            --github-output $env:GITHUB_OUTPUT
          Get-Content -LiteralPath release-source-evidence.json

      - name: Resolve and verify existing release state
        id: release_state
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_SHA: ${{ steps.metadata.outputs.release_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          node ./scripts/resolve-github-release.mjs `
            --repository $env:GITHUB_REPOSITORY `
            --tag $env:RELEASE_TAG `
            --expected-sha $env:EXPECTED_RELEASE_SHA `
            --output existing-release-state.json `
            --github-output $env:GITHUB_OUTPUT
          $releaseState = Get-Content -LiteralPath existing-release-state.json -Raw | ConvertFrom-Json
          if ($releaseState.state -eq 'published') {
            ./scripts/verify-github-release.ps1 `
              -ReleaseId $releaseState.release.id `
              -Repository $env:GITHUB_REPOSITORY `
              -Tag $env:RELEASE_TAG `
              -ExpectedState published `
              -OutputDirectory published-existing
            Write-Host "Release $env:RELEASE_TAG is already published and verified; publication is an idempotent no-op."
          }

  build:
    name: build-and-verify-release-assets
    needs: authorize
    if: needs.authorize.outputs.published != 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      CI: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      PACKAGE_VERSION: ${{ needs.authorize.outputs.version }}
      EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}

    steps:
      - name: Checkout authorized tag SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm build checkout matches authorization
        shell: pwsh
        run: |
          $head = git rev-parse HEAD
          $tagHead = git rev-parse "refs/tags/$env:RELEASE_TAG^{commit}"
          if ($head -ne $env:EXPECTED_RELEASE_SHA -or $tagHead -ne $env:EXPECTED_RELEASE_SHA) {
            throw "Build checkout/tag moved: head=$head tag=$tagHead authorized=$env:EXPECTED_RELEASE_SHA"
          }

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Enforce production dependency advisory policy
        run: npm run dependency-audit:check

      # Source tests and full Windows interactions already passed in the
      # authorized exact-SHA main CI. Repeat only release-specific policy;
      # fresh dependency audits and tests of newly built bytes remain below.
      - name: Validate release-only policy
        shell: pwsh
        env:
          REQUIRE_PUBLISHED_RELEASE_NOTES: "1"
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npx tsx scripts/test-release-consistency.ts

      - name: Build Setup-only release from authorized SHA
        id: desktop_build
        run: npm run desktop:build

      - name: Verify staged and packaged desktop assets
        run: npm run desktop:packaged-assets-test

      - name: Test final Setup bytes
        if: ${{ always() && steps.desktop_build.outcome == 'success' }}
        run: npm run desktop:final-artifact-smoke

      - name: Normalize release asset filenames
        shell: pwsh
        run: |
          $version = '${{ needs.authorize.outputs.version }}'
          $expectedName = "Lyrics.Card.Generator.Setup.$version.exe"
          $legacyName = "Lyrics Card Generator Setup $version.exe"
          $executables = @(Get-ChildItem release -File -Filter '*.exe')
          if ($executables.Count -ne 1) { throw "Expected exactly one Setup executable, found $($executables.Count): $($executables.Name -join ', ')." }
          if ($executables[0].Name -eq $legacyName) {
            Rename-Item -LiteralPath $executables[0].FullName -NewName $expectedName
          } elseif ($executables[0].Name -ne $expectedName) {
            throw "Unexpected Windows executable: $($executables[0].Name)"
          }
          $normalized = @(Get-ChildItem release -File -Filter '*.exe')
          if ($normalized.Count -ne 1 -or $normalized[0].Name -ne $expectedName) {
            throw "Release asset normalization did not produce the sole expected Setup asset $expectedName."
          }

      - name: Audit packaged Electron runtime dependency closure
        # Deterministic audit/SBOM fixtures ran in exact-SHA CI. Recompute the
        # actual packaged closure and query current advisories for these bytes.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          npm run desktop-runtime-audit:prepare
          npm run desktop-runtime-audit:check

      - name: Prepare packaged runtime SBOM input
        run: npm run sbom:prepare

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist-desktop/sbom-runtime
          config: security/syft-release.yaml
          syft-version: v1.51.0
          format: spdx-json
          output-file: release/lyrics-card-generator-${{ needs.authorize.outputs.version }}.spdx.json
          upload-artifact: false

      - name: Bind audited Electron runtime into SPDX SBOM
        run: npm run sbom:finalize -- release/lyrics-card-generator-${{ needs.authorize.outputs.version }}.spdx.json

      - name: Inspect packaged runtime SPDX SBOM
        run: npm run sbom:inspect -- release/lyrics-card-generator-${{ needs.authorize.outputs.version }}.spdx.json

      - name: Generate SHA256SUMS
        shell: pwsh
        run: |
          $version = '${{ needs.authorize.outputs.version }}'
          $expectedNames = @(
            "Lyrics.Card.Generator.Setup.$version.exe",
            "lyrics-card-generator-$version.spdx.json"
          ) | Sort-Object
          $files = @(Get-ChildItem release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -like '*.spdx.json' } | Sort-Object Name)
          if (($files.Name -join "`n") -ne ($expectedNames -join "`n")) {
            throw "Unexpected checksum subject set: $($files.Name -join ', ')"
          }
          $lines = $files | ForEach-Object { '{0} *{1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name }
          [IO.File]::WriteAllLines((Join-Path $PWD 'release/SHA256SUMS'), $lines, [Text.UTF8Encoding]::new($false))

      - name: Attest tested release files
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            release/Lyrics.Card.Generator.Setup.${{ needs.authorize.outputs.version }}.exe
            release/SHA256SUMS
            release/lyrics-card-generator-${{ needs.authorize.outputs.version }}.spdx.json

      - name: Upload tested release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lyrics-card-generator-${{ env.RELEASE_TAG }}-${{ needs.authorize.outputs.release_sha }}-tested
          path: |
            release/Lyrics.Card.Generator.Setup.${{ needs.authorize.outputs.version }}.exe
            release/SHA256SUMS
            release/lyrics-card-generator-${{ needs.authorize.outputs.version }}.spdx.json
          if-no-files-found: error

      - name: Upload release test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-test-evidence-${{ env.RELEASE_TAG }}-${{ github.run_attempt }}
          path: |
            playwright-report/desktop-final-artifacts/**
          if-no-files-found: ignore

  publish:
    name: publish-verified-release
    needs:
      - authorize
      - build
    if: needs.authorize.outputs.published != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      actions: read
      attestations: read
      contents: write
      pull-requests: read
    env:
      PACKAGE_VERSION: ${{ needs.authorize.outputs.version }}
      EXPECTED_RELEASE_SHA: ${{ needs.authorize.outputs.release_sha }}

    steps:
      - name: Checkout authorized tag SHA
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Reauthorize source before Release mutation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = git rev-parse HEAD
          if ($head -ne $env:EXPECTED_RELEASE_SHA) {
            throw "Publication checkout $head does not match authorized SHA $env:EXPECTED_RELEASE_SHA"
          }
          node ./scripts/verify-release-source.mjs `
            --repository $env:GITHUB_REPOSITORY `
            --tag $env:RELEASE_TAG `
            --expected-sha $env:EXPECTED_RELEASE_SHA `
            --output publication-source-evidence.json

      - name: Download tested release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: lyrics-card-generator-${{ env.RELEASE_TAG }}-${{ needs.authorize.outputs.release_sha }}-tested
          path: release

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true

          function Resolve-ExactRelease([string]$OutputPath) {
            node ./scripts/resolve-github-release.mjs `
              --repository $env:GITHUB_REPOSITORY `
              --tag $env:RELEASE_TAG `
              --expected-sha $env:EXPECTED_RELEASE_SHA `
              --output $OutputPath | Out-Host
            return Get-Content -LiteralPath $OutputPath -Raw | ConvertFrom-Json
          }

          $releaseState = Resolve-ExactRelease 'pre-draft-release-state.json'
          if ($releaseState.state -eq 'published') {
            throw "Release $env:RELEASE_TAG became published after state resolution; rerun to verify it idempotently."
          }

          $draft = $null
          if ($releaseState.state -eq 'draft') {
            $draft = $releaseState.release
            Write-Host "Reusing exact draft release $($draft.id); its assets must match the tested bundle before publication."
          } else {
            $flags = @()
            if ($env:RELEASE_TAG -like '*-rc.*') { $flags += '--prerelease' }
            $PSNativeCommandUseErrorActionPreference = $false
            $setupAsset = "release/Lyrics.Card.Generator.Setup.$env:PACKAGE_VERSION.exe"
            $sbomAsset = "release/lyrics-card-generator-$env:PACKAGE_VERSION.spdx.json"
            $createOutput = @(& gh release create $env:RELEASE_TAG $setupAsset release/SHA256SUMS $sbomAsset --draft --verify-tag --target $env:EXPECTED_RELEASE_SHA --title "Lyrics Card Generator $env:RELEASE_TAG" --notes-file "docs/releases/v$env:PACKAGE_VERSION.zh-CN.md" @flags 2>&1)
            $createExitCode = $LASTEXITCODE
            $PSNativeCommandUseErrorActionPreference = $true
            if ($createOutput.Count -gt 0) { $createOutput | ForEach-Object { Write-Host $_ } }

            for ($attempt = 1; $attempt -le 10; $attempt++) {
              $releaseState = Resolve-ExactRelease 'post-create-release-state.json'
              if ($releaseState.state -eq 'published') {
                throw "Release $env:RELEASE_TAG became published before draft verification."
              }
              if ($releaseState.state -eq 'draft') {
                $draft = $releaseState.release
                break
              }
              if ($attempt -lt 10) { Start-Sleep -Seconds 2 }
            }
            if ($null -eq $draft -and $createExitCode -ne 0) {
              throw "Draft creation failed and no exact release became visible: $($createOutput -join [Environment]::NewLine)"
            }
          }
          if ($null -eq $draft) {
            throw "Draft release for $env:RELEASE_TAG was not visible after 10 bounded attempts."
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RELEASE_ID=$($draft.id)" -Encoding utf8

      - name: Re-download and verify exact draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/verify-github-release.ps1 `
            -ReleaseId $env:RELEASE_ID `
            -Repository $env:GITHUB_REPOSITORY `
            -Tag $env:RELEASE_TAG `
            -ExpectedState draft `
            -OutputDirectory published-draft `
            -ExpectedAssetDirectory release

      - name: Reauthorize source immediately before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node ./scripts/verify-release-source.mjs `
            --repository $env:GITHUB_REPOSITORY `
            --tag $env:RELEASE_TAG `
            --expected-sha $env:EXPECTED_RELEASE_SHA `
            --output final-publication-source-evidence.json

      - name: Publish verified GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $published = gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$env:RELEASE_ID" -F draft=false | ConvertFrom-Json
          if ($published.draft) { throw "Release $env:RELEASE_ID remained a draft after publishing." }
          if ($published.tag_name -ne $env:RELEASE_TAG) { throw "Published release tag $($published.tag_name) does not match $env:RELEASE_TAG." }
